<svg xmlns="http://www.w3.org/2000/svg" width="360" height="190" viewBox="0 0 360 190">
  <!-- GPU card, top view. Black is density, white is a cut: the substance reads
       black as mass, so vents, ports and the engraved model are painted white
       over the shroud rather than punched out of the path.

       Every feature is drawn thicker than the displacement can smear it. The
       grain moves UVs by about 13 texture pixels at this mark's tighten, so a
       thin blade averages out into a flat ring and the rotation becomes
       invisible — hence five broad radial blades with wide gaps rather than nine
       slender ones. -->

  <!-- I/O bracket -->
  <rect x="0" y="12" width="15" height="150" rx="3"/>
  <rect x="4" y="30"  width="8" height="26" rx="2" fill="#fff"/>
  <rect x="4" y="66"  width="8" height="26" rx="2" fill="#fff"/>
  <rect x="4" y="102" width="8" height="26" rx="2" fill="#fff"/>

  <!-- shroud, with the two fan openings cut out -->
  <path fill-rule="evenodd" d="
    M34 4 h304 a14 14 0 0 1 14 14 v136 a14 14 0 0 1 -14 14 h-304 a14 14 0 0 1 -14 -14 v-136 a14 14 0 0 1 14 -14 z
    M118 112 m-46 0 a46 46 0 1 0 92 0 a46 46 0 1 0 -92 0 z
    M250 112 m-46 0 a46 46 0 1 0 92 0 a46 46 0 1 0 -92 0 z" />

  <!-- rims, blades, hubs — everything inside the openings turns -->
  <circle cx="118" cy="112" r="45" fill="none" stroke="#000" stroke-width="4"/>
  <circle cx="250" cy="112" r="45" fill="none" stroke="#000" stroke-width="4"/>
  <path d="M134.0 112.0 Q147.1 119.3 152.0 134.9" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M122.9 127.2 Q120.1 141.9 106.7 151.4" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M105.1 121.4 Q90.2 123.2 77.0 113.4" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M105.1 102.6 Q98.7 89.0 104.0 73.5" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M122.9 96.8 Q133.9 86.6 150.3 86.8" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M266.0 112.0 Q279.1 119.3 284.0 134.9" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M254.9 127.2 Q252.1 141.9 238.7 151.4" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M237.1 121.4 Q222.2 123.2 209.0 113.4" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M237.1 102.6 Q230.7 89.0 236.0 73.5" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <path d="M254.9 96.8 Q265.9 86.6 282.3 86.8" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  <circle cx="118" cy="112" r="15"/>
  <circle cx="250" cy="112" r="15"/>

  <!-- heatsink slots -->
  <rect x="304" y="72" width="5" height="80" rx="2" fill="#fff"/>
  <rect x="314" y="72" width="5" height="80" rx="2" fill="#fff"/>
  <rect x="324" y="72" width="5" height="80" rx="2" fill="#fff"/>
  <rect x="334" y="72" width="5" height="80" rx="2" fill="#fff"/>

  <!-- PCIe edge connector -->
  <rect x="74" y="168" width="7" height="16" rx="1"/>
  <rect x="86" y="168" width="7" height="16" rx="1"/>
  <rect x="98" y="168" width="7" height="16" rx="1"/>
  <rect x="110" y="168" width="7" height="16" rx="1"/>
  <rect x="134" y="168" width="7" height="16" rx="1"/>
  <rect x="146" y="168" width="7" height="16" rx="1"/>
  <rect x="158" y="168" width="7" height="16" rx="1"/>
  <rect x="170" y="168" width="7" height="16" rx="1"/>
  <rect x="182" y="168" width="7" height="16" rx="1"/>
  <rect x="194" y="168" width="7" height="16" rx="1"/>
  <rect x="206" y="168" width="7" height="16" rx="1"/>
  <rect x="218" y="168" width="7" height="16" rx="1"/>
  <rect x="230" y="168" width="7" height="16" rx="1"/>
  <rect x="242" y="168" width="7" height="16" rx="1"/>
  <rect x="254" y="168" width="7" height="16" rx="1"/>
  <rect x="266" y="168" width="7" height="16" rx="1"/>

  <!-- model, engraved into the shroud -->
  <text x="186" y="49" fill="#fff" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="9">UMINERS</text>
</svg>
